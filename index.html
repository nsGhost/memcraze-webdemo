<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>MemCraze</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d1a'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%234cc9f0' font-family='sans-serif' font-weight='bold'%3EM%3C/text%3E%3C/svg%3E">
  <style>
    /* Fill the browser client area and follow every resize. Unity's stock template
       hardcodes canvas.style.width/height to 960x600 on desktop, which never responds
       to window size and overflows any window narrower than 960px. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0d1a;
    }

    #unity-container {
      position: absolute;
      inset: 0;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0d0d1a;
      /* Suppress the focus ring; the canvas takes keyboard focus for gameplay. */
      outline: none;
    }

    /* ── Loading ─────────────────────────────────────────────────────────── */
    #unity-loading-bar {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0d1a;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #unity-logo {
      font-size: 34px;
      font-weight: bold;
      letter-spacing: 4px;
      color: #4cc9f0;
      margin-bottom: 4px;
    }

    #unity-loading-sub {
      font-size: 13px;
      letter-spacing: 2px;
      color: #8888aa;
      margin-bottom: 22px;
    }

    #unity-progress-bar-empty {
      width: 260px;
      height: 10px;
      border-radius: 5px;
      background: #1e1e3a;
      overflow: hidden;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      border-radius: 5px;
      background: #4cc9f0;
      transition: width 0.15s ease-out;
    }

    #unity-loading-note {
      margin-top: 18px;
      font-size: 12px;
      color: #6a6a88;
      max-width: 320px;
      text-align: center;
      line-height: 1.5;
    }

    /* ── Warnings ────────────────────────────────────────────────────────── */
    #unity-warning {
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
      z-index: 10;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #unity-warning > div {
      border-radius: 6px;
      margin-bottom: 6px;
      padding: 10px 14px;
      font-size: 13px;
    }

    /* ── Fullscreen ──────────────────────────────────────────────────────── */
    #unity-fullscreen-button {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid #4361ee;
      background: rgba(13, 13, 26, 0.72);
      color: #4cc9f0;
      font-size: 15px;
      line-height: 32px;
      text-align: center;
      cursor: pointer;
      opacity: 0.35;
      transition: opacity 0.15s;
      user-select: none;
    }

    #unity-fullscreen-button:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo">MEMCRAZE</div>
      <div id="unity-loading-sub">TEST YOUR MEMORY</div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      <div id="unity-loading-note">First load downloads about 60&nbsp;MB &mdash; it is cached after this.</div>
    </div>

    <div id="unity-warning"></div>
    <div id="unity-fullscreen-button" title="Fullscreen">&#9974;</div>
  </div>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas    = document.querySelector("#unity-canvas");
    var warning   = document.querySelector("#unity-warning");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progress   = document.querySelector("#unity-progress-bar-full");

    function unityShowBanner(msg, type) {
      var div = document.createElement('div');
      div.innerHTML = msg;
      warning.appendChild(div);
      if (type == 'error') {
        div.style.background = '#f72585';
        div.style.color = '#fff';
      } else {
        if (type == 'warning') {
          div.style.background = '#f4a261';
          div.style.color = '#1a1a2e';
        }
        // Non-fatal messages disappear on their own so they don't sit over the game.
        setTimeout(function () {
          warning.removeChild(div);
        }, 5000);
      }
    }

    var buildUrl  = "Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js";
    var config = {
      dataUrl: buildUrl + "/WebGL.data",
      frameworkUrl: buildUrl + "/WebGL.framework.js",
      codeUrl: buildUrl + "/WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "High Morale Visual Entertainment",
      productName: "MemCraze",
      productVersion: "1.2.0.2",
      showBanner: unityShowBanner,
    };

    // Keep the WebGL render target matched to the canvas's on-screen size, accounting
    // for device pixel ratio, and re-sync on every resize / orientation change. This is
    // what makes the game actually responsive instead of a fixed 960x600 box.
    // Phones report devicePixelRatio 3-4. Rendering a Unity scene at 3-4x a phone-sized
    // viewport is 2.7-4.9 megapixels per frame, which mobile GPUs cannot sustain. Cap the
    // render scale on touch devices; the display still downsamples it cleanly.
    var IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    var MAX_DPR   = IS_MOBILE ? 2 : 3;

    function syncCanvasSize(instance) {
      var dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
      var w = Math.max(1, Math.floor(container.clientWidth  * dpr));
      var h = Math.max(1, Math.floor(container.clientHeight * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width  = w;
        canvas.height = h;
      }
    }

    loadingBar.style.display = "flex";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (p) => {
        progress.style.width = (100 * p) + "%";
      }).then((instance) => {
        loadingBar.style.display = "none";
        syncCanvasSize(instance);

        window.addEventListener("resize", () => syncCanvasSize(instance));
        window.addEventListener("orientationchange", () => {
          setTimeout(() => syncCanvasSize(instance), 100);
        });

        document.querySelector("#unity-fullscreen-button").onclick = () => {
          instance.SetFullscreen(1);
        };
      }).catch((message) => {
        unityShowBanner(message, 'error');
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
